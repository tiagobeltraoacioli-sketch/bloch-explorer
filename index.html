<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" id="themeColor" content="#070d0b" />
    <meta
      name="description"
      content="Block explorer for Bloch Genesis-4 — a post-quantum proof-of-stake chain with 64 genesis validators, 30-second slots and finality by epoch. Independent reference explorer; carries the Genesis-3 closing balances as its opening state."
    />
    <title>Bloch Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='11.2' fill='none' stroke='%233ddc9f' stroke-width='1.8'/%3E%3Cellipse cx='13' cy='13' rx='11.2' ry='4.2' fill='none' stroke='%233ddc9f' stroke-width='1.2' opacity='0.55'/%3E%3Cline x1='13' y1='13' x2='19.6' y2='7.2' stroke='%23eef5f2' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='19.6' cy='7.2' r='2.3' fill='%233ddc9f'/%3E%3C/svg%3E" />
    <!--
      Theme bootstrap. Runs before the stylesheet paints so the first frame is
      already in the chosen theme: a dark page that flashes white (or the other
      way round) is the one visual defect nobody forgives. The stored value is
      "dark" | "light" | "system"; anything else is treated as the default,
      which is dark — the same default the Bloch wallet ships.
    -->
    <script>
      (function () {
        var t = "dark";
        try {
          var s = localStorage.getItem("bloch.explorer.theme");
          if (s === "light" || s === "dark") t = s;
          else if (s === "system") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
        } catch (e) { /* storage unavailable: stay on the default */ }
        document.documentElement.setAttribute("data-theme", t);
        var m = document.getElementById("themeColor");
        if (m) m.setAttribute("content", t === "light" ? "#f4f7f6" : "#070d0b");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
